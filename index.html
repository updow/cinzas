<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cinzas – protótipo</title>
<style>
:root{--bg:#c9a77a;--panel:rgba(30,22,16,.62);--ink:#f3e6cf;--life:#c4452d;--food:#d9822b;--water:#4aa8d8;--track:rgba(255,255,255,.14)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a2018;--panel:rgba(12,9,6,.7);--ink:#f3e6cf}}
:root[data-theme="dark"]{--bg:#2a2018;--panel:rgba(12,9,6,.7);--ink:#f3e6cf}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;font-family:"Trebuchet MS","Segoe UI",sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#hud{position:fixed;left:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 0;pointer-events:none;width:min(260px,70vw)}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:6px;background:var(--panel);padding:5px 9px;border-radius:8px;font-size:13px}
.bar span{width:42px}
.bar i{flex:1;height:8px;border-radius:4px;background:var(--track);overflow:hidden;display:block}
.bar b{display:block;height:100%;width:100%;border-radius:4px}
#score{position:fixed;right:14px;top:calc(env(safe-area-inset-top,0px) + 12px);background:var(--panel);padding:6px 10px;border-radius:8px;font-size:13px;pointer-events:none}
#hint{position:fixed;left:0;right:0;top:34%;text-align:center;font-size:15px;padding:0 24px;pointer-events:none;text-shadow:0 1px 4px #000;transition:opacity 1.2s}
#stick{position:fixed;left:22px;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);width:124px;height:124px;border-radius:50%;background:var(--panel);touch-action:none}
#knob{position:absolute;left:36px;top:36px;width:52px;height:52px;border-radius:50%;background:var(--ink);opacity:.55}
#run{position:fixed;right:22px;bottom:calc(env(safe-area-inset-bottom,0px) + 40px);width:76px;height:76px;border-radius:50%;border:0;background:var(--panel);color:var(--ink);font:600 14px inherit;touch-action:none}
#run.on{background:var(--food);color:#1b120b}
#act{position:fixed;right:22px;bottom:calc(env(safe-area-inset-bottom,0px) + 132px);display:flex;gap:10px}
#act button{border:0;border-radius:12px;padding:12px 14px;background:var(--panel);color:var(--ink);font:600 14px "Trebuchet MS",sans-serif;touch-action:manipulation}
#act button b{margin-left:4px;color:var(--food)}
#act button:disabled{opacity:.4}
#toast{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 200px);text-align:center;pointer-events:none;opacity:0;transition:opacity .3s;font-size:14px;text-shadow:0 1px 4px #000}
#over{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(20,10,6,.8);text-align:center;padding:24px}
#over h1{margin:0;font-size:30px}
#over button{font:600 16px inherit;padding:12px 22px;border:0;border-radius:8px;background:var(--food);color:#1b120b}
</style>
</head>
<body>
<div id="hud">
<div class="bar"><span>Vida</span><i><b id="bL" style="background:var(--life)"></b></i></div>
<div class="bar"><span>Fome</span><i><b id="bF" style="background:var(--food)"></b></i></div>
<div class="bar"><span>Sede</span><i><b id="bW" style="background:var(--water)"></b></i></div>
</div>
<div id="score">Achados: 0</div>
<div id="hint">Pegue latas laranjas e garrafas azuis.<br>Use Comer e Beber quando quiser. Arraste para olhar.</div>
<div id="stick"><div id="knob"></div></div>
<button id="run">Correr</button>
<div id="act"><button id="eat">Comer <b id="nF">0</b></button><button id="drink">Beber <b id="nW">0</b></button></div>
<div id="toast"></div>
<div id="over"><h1>Você não sobreviveu</h1><p id="why"></p><button id="again">Tentar de novo</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
var T=THREE,W=window,R=Math.random;
var scene=new T.Scene();scene.background=new T.Color(0xc9a77a);scene.fog=new T.FogExp2(0xc9a77a,0.012);
var cam=new T.PerspectiveCamera(65,1,0.1,400);
var rd=new T.WebGLRenderer({antialias:true});rd.setPixelRatio(Math.min(W.devicePixelRatio||1,2));
document.body.prepend(rd.domElement);
scene.add(new T.HemisphereLight(0xffe2b8,0x4a3a2c,0.9));
var sun=new T.DirectionalLight(0xffd9a0,0.8);sun.position.set(60,80,30);scene.add(sun);

var SIZE=300,HALF=SIZE/2;
function h(x,z){return 2.2*Math.sin(x*.03)*Math.cos(z*.025)+1.1*Math.sin(x*.07+z*.05)}
var g=new T.PlaneGeometry(SIZE,SIZE,110,110);g.rotateX(-Math.PI/2);
var p=g.attributes.position;for(var i=0;i<p.count;i++)p.setY(i,h(p.getX(i),p.getZ(i)));
g.computeVertexNormals();
scene.add(new T.Mesh(g,new T.MeshLambertMaterial({color:0x7a6548,flatShading:true})));

var blockers=[];
function building(x,z){
 var w=5+R()*7,d=5+R()*7,ht=4+R()*10;
 var c=[0x6d6258,0x7d5a45,0x5c5650,0x84745f][Math.floor(R()*4)];
 var m=new T.MeshLambertMaterial({color:c,flatShading:true});
 var b=new T.Mesh(new T.BoxGeometry(w,ht,d),m);b.position.set(x,h(x,z)+ht/2-.5,z);scene.add(b);
 var t=new T.Mesh(new T.BoxGeometry(w*.6,ht*.35,d*.7),m);
 t.position.set(x+w*.15,h(x,z)+ht+ht*.1,z);t.rotation.set(R()*.4,R()*.6,R()*.4);scene.add(t);
 blockers.push({x:x,z:z,r:Math.max(w,d)*.62});
}
function free(x,z,r){for(var j=0;j<blockers.length;j++){var b=blockers[j];if(Math.hypot(x-b.x,z-b.z)<b.r+r+1.5)return false}return true}
var MM={};
function mat(c){return MM[c]||(MM[c]=new T.MeshLambertMaterial({color:c,flatShading:true}))}
function part(g,geo,c,x,y,z,rx,ry,rz){var m=new T.Mesh(geo,mat(c));m.position.set(x,y,z);if(rx||ry||rz)m.rotation.set(rx||0,ry||0,rz||0);g.add(m);return m}
function house(x,z){
 var w=5+R()*2,d=5+R()*1.5,wh=2.6,g=new T.Group(),ruin=R()<.4;
 var wc=[0x8a7b66,0x7d6b57,0x6f6a60,0x93806a][Math.floor(R()*4)],rc=[0x6b3a2a,0x4d4a46,0x7a4a30][Math.floor(R()*3)];
 part(g,new T.BoxGeometry(w,wh,d),wc,0,wh/2,0);
 var a=.5,hd=d/2+.35,len=hd/Math.cos(a),rise=hd*Math.tan(a),rg=new T.BoxGeometry(w+.7,.15,len);
 part(g,rg,rc,0,wh+rise/2,-hd/2,-a,0,0);
 if(ruin)part(g,new T.BoxGeometry(1.4,.6,1.1),0x3a332c,w*.2,.3,d*.75,0,.5,0);else part(g,rg,rc,0,wh+rise/2,hd/2,a,0,0);
 part(g,new T.BoxGeometry(1,1.9,.12),0x2b2118,0,.95,d/2);
 part(g,new T.BoxGeometry(1.6,.15,.7),0x5c5650,0,.07,d/2+.4);
 part(g,new T.BoxGeometry(.9,.8,.12),0x1b1a18,-w*.3,1.5,d/2);part(g,new T.BoxGeometry(.9,.8,.12),0x1b1a18,w*.3,1.5,d/2);
 part(g,new T.BoxGeometry(.5,1.4,.5),0x5c4a3e,w*.3,wh+1,-d*.15);
 g.position.set(x,h(x,z)-.3,z);g.rotation.y=R()*6.28;scene.add(g);
 blockers.push({x:x,z:z,r:Math.hypot(w,d)/2-.2});
}
var trunkG=new T.CylinderGeometry(.1,.26,1,6),brG=new T.CylinderGeometry(.03,.09,1,5),shG=new T.DodecahedronGeometry(.5,0);
function tree(x,z){
 var g=new T.Group(),H=3.2+R()*2.6,n=3+Math.floor(R()*3);
 part(g,trunkG,0x3a2c20,0,H/2,0).scale.y=H;
 for(var i=0;i<n;i++){var yy=H*(.45+.5*i/n),an=R()*6.28,bl=.8+R()*.7,br=part(g,brG,0x3a2c20,Math.cos(an)*.4,yy,Math.sin(an)*.4,Math.sin(an)*.9,0,-Math.cos(an)*.9);br.scale.y=bl}
 g.position.set(x,h(x,z),z);g.rotation.y=R()*6.28;scene.add(g);
 blockers.push({x:x,z:z,r:.45});
}
function bush(x,z){var m=new T.Mesh(shG,mat([0x6b6240,0x5a5236,0x7a6a45][Math.floor(R()*3)])),s=.6+R()*.8;m.scale.set(s,s*.7,s);m.position.set(x,h(x,z)+.2,z);m.rotation.y=R()*6;scene.add(m)}
function scatter(n,r,fn,minD){var c=0,t=0;while(c<n&&t<n*25){t++;var x=(R()-.5)*(SIZE-20),z=(R()-.5)*(SIZE-20);if(Math.hypot(x,z)>minD&&free(x,z,r)){fn(x,z);c++}}}
scatter(8,6,building,24);scatter(26,4.5,house,18);scatter(60,.5,tree,8);
for(var i=0;i<50;i++){var bx0=(R()-.5)*(SIZE-10),bz0=(R()-.5)*(SIZE-10);if(Math.hypot(bx0,bz0)>5)bush(bx0,bz0)}

var items=[];
function em(c,e,o){return new T.MeshLambertMaterial(Object.assign({color:c,emissive:e,flatShading:true},o||{}))}
var P_food=new T.Group(),P_bot=new T.Group(),P_can=new T.Group();
(function(){
 function cyl(g,r1,r2,hh,mt,y){var m=new T.Mesh(new T.CylinderGeometry(r1,r2,hh,10),mt);m.position.y=y;g.add(m)}
 var tin=em(0xb8b6ae,0x222222),lab=em(0xd9822b,0x663300),wat=em(0x6fc2ea,0x0a3a55,{transparent:true,opacity:.85}),cap=em(0xf2f2f2,0x333333),red=em(0xc23a2b,0x4a0d08),sil=em(0xcfcfcf,0x222222);
 cyl(P_food,.12,.12,.24,tin,0);cyl(P_food,.123,.123,.14,lab,0);
 cyl(P_bot,.1,.1,.34,wat,-.03);cyl(P_bot,.045,.085,.1,wat,.19);cyl(P_bot,.05,.05,.05,cap,.27);
 cyl(P_can,.09,.09,.3,red,0);cyl(P_can,.085,.09,.025,sil,.16);cyl(P_can,.09,.085,.025,sil,-.16);
 [[P_food,0xd9822b],[P_bot,0x4aa8d8],[P_can,0xc23a2b]].forEach(function(a){var r=new T.Mesh(new T.RingGeometry(.35,.48,18),new T.MeshBasicMaterial({color:a[1],transparent:true,opacity:.55,side:T.DoubleSide}));r.rotation.x=-Math.PI/2;r.position.y=-.55;a[0].add(r)});
})();
function makeItem(kind){var g=(kind==='f'?P_food:(R()<.5?P_bot:P_can)).clone();g.scale.setScalar(1.5);return g}

function spawn(kind){
 var x,z,ok;
 do{x=(R()-.5)*(SIZE-16);z=(R()-.5)*(SIZE-16);ok=true;
  for(var j=0;j<blockers.length;j++)if(Math.hypot(x-blockers[j].x,z-blockers[j].z)<blockers[j].r+1){ok=false;break}
 }while(!ok);
 var m=makeItem(kind);
 m.position.set(x,h(x,z)+.9,z);m.userData={kind:kind,y0:m.position.y};scene.add(m);items.push(m);
}
for(var i=0;i<30;i++){spawn('f');spawn('w')}

var pl=new T.Group(),P={t:0,bob:0};
function bxp(g,w,hh,d,c,x,y,z){return part(g,new T.BoxGeometry(w,hh,d),c,x,y,z)}
(function(){
 var jacket=0x566645,pants=0x3b3a36,boot=0x2a1d14,skin=0xd8b08c;
 P.torso=new T.Group();pl.add(P.torso);
 bxp(P.torso,.54,.62,.3,jacket,0,1.13,0);
 bxp(P.torso,.56,.07,.32,boot,0,.85,0);
 bxp(P.torso,.06,.6,.04,boot,-.15,1.13,.16);bxp(P.torso,.06,.6,.04,boot,.15,1.13,.16);
 part(P.torso,new T.CylinderGeometry(.08,.08,.22,8),0x6b7a4a,-.32,.88,.02);
 bxp(P.torso,.42,.55,.22,0x6b4a2c,0,1.15,-.26);
 bxp(P.torso,.44,.1,.24,0x4d3520,0,1.46,-.26);
 part(P.torso,new T.CylinderGeometry(.09,.09,.46,8),0x7a7a6a,0,1.55,-.28,0,0,Math.PI/2);
 bxp(P.torso,.3,.08,.2,0xa63d2f,0,1.44,.02);
 P.head=new T.Group();P.head.position.y=1.58;pl.add(P.head);
 part(P.head,new T.SphereGeometry(.17,10,8),skin,0,0,0);
 part(P.head,new T.SphereGeometry(.185,10,6,0,Math.PI*2,0,Math.PI/2),0x4a3a2a,0,.04,-.01);
 bxp(P.head,.22,.03,.14,0x4a3a2a,0,.05,.17);
 bxp(P.head,.05,.04,.03,0x111111,-.06,0,.155);bxp(P.head,.05,.04,.03,0x111111,.06,0,.155);
 function leg(sx){var g=new T.Group();g.position.set(sx,.82,0);pl.add(g);bxp(g,.2,.7,.22,pants,0,-.35,0);bxp(g,.24,.18,.34,boot,0,-.75,.05);return g}
 P.lL=leg(-.13);P.lR=leg(.13);
 function arm(sx){var g=new T.Group();g.position.set(sx,1.4,0);pl.add(g);bxp(g,.15,.5,.15,jacket,0,-.25,0);bxp(g,.17,.14,.17,boot,0,-.56,0);return g}
 P.aL=arm(-.36);P.aR=arm(.36);
 P.hold=new T.Mesh(new T.CylinderGeometry(.06,.06,.2,8),mat(0x4aa8d8));P.hold.position.set(0,-.62,.1);P.hold.visible=false;P.aR.add(P.hold);
})();
scene.add(pl);
function animPl(dt,now,l,run){
 var mv=l>.05;
 P.t+=dt*(mv?(run?13:9):0);
 var s=mv?(run?.95:.65):0,a=Math.sin(P.t)*s;
 P.lL.rotation.x=a;P.lR.rotation.x=-a;P.aL.rotation.x=-a*.9;
 if(S.anim>0){S.anim-=dt;P.aR.rotation.x=-2;P.hold.visible=true;P.head.rotation.x=S.use==='w'?-.28:0}
 else{P.aR.rotation.x=a*.9;P.hold.visible=false;P.head.rotation.x=0}
 P.bob=mv?Math.abs(Math.sin(P.t))*.06:0;
 P.torso.scale.y=1+Math.sin(now/600)*.012;
}

var S,yaw=0,pitch=.35,joy={x:0,y:0},keys={},runBtn=false,hint=document.getElementById('hint');
function reset(){S={x:0,z:0,life:100,food:100,water:100,got:0,dead:false,anim:0,use:'',inv:{food:2,water:2}};document.getElementById('over').style.display='none';hint.style.opacity=1;setTimeout(function(){hint.style.opacity=0},6000)}
reset();
function size(){rd.setSize(W.innerWidth,W.innerHeight);cam.aspect=W.innerWidth/W.innerHeight;cam.updateProjectionMatrix()}
W.addEventListener('resize',size);size();
W.addEventListener('keydown',function(e){keys[e.code]=1});W.addEventListener('keyup',function(e){keys[e.code]=0});

var st=document.getElementById('stick'),kn=document.getElementById('knob'),sid=null;
function sj(e){var r=st.getBoundingClientRect(),dx=e.clientX-(r.left+62),dy=e.clientY-(r.top+62),l=Math.hypot(dx,dy),m=Math.min(l,50);
 if(l>0){dx=dx/l*m;dy=dy/l*m}joy.x=dx/50;joy.y=-dy/50;kn.style.transform='translate('+dx+'px,'+dy+'px)'}
st.addEventListener('pointerdown',function(e){sid=e.pointerId;st.setPointerCapture(sid);sj(e)});
st.addEventListener('pointermove',function(e){if(e.pointerId===sid)sj(e)});
function sEnd(e){if(e.pointerId===sid){sid=null;joy.x=joy.y=0;kn.style.transform=''}}
st.addEventListener('pointerup',sEnd);st.addEventListener('pointercancel',sEnd);
var rb=document.getElementById('run');
rb.addEventListener('pointerdown',function(){runBtn=true;rb.classList.add('on')});
['pointerup','pointercancel','pointerleave'].forEach(function(n){rb.addEventListener(n,function(){runBtn=false;rb.classList.remove('on')})});
var lid=null,lx=0,ly=0,cv=rd.domElement;
cv.addEventListener('pointerdown',function(e){lid=e.pointerId;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(lid)});
cv.addEventListener('pointermove',function(e){if(e.pointerId!==lid)return;yaw-=(e.clientX-lx)*.006;pitch=Math.max(.05,Math.min(1.0,pitch+(e.clientY-ly)*.004));lx=e.clientX;ly=e.clientY});
cv.addEventListener('pointerup',function(){lid=null});cv.addEventListener('pointercancel',function(){lid=null});
document.getElementById('again').onclick=reset;

var tEl=document.getElementById('toast'),tT=0,nF=document.getElementById('nF'),nW=document.getElementById('nW'),bE=document.getElementById('eat'),bD=document.getElementById('drink');
function toast(t){tEl.textContent=t;tEl.style.opacity=1;clearTimeout(tT);tT=setTimeout(function(){tEl.style.opacity=0},1600)}
function eatAnim(k){S.anim=.9;S.use=k==='food'?'f':'w';P.hold.material=mat(k==='food'?0xd9822b:0x4aa8d8)}
function useItem(k){
 if(S.dead)return;
 if(k==='food'){if(S.inv.food<1)return toast('Sem comida');if(S.food>=100)return toast('Fome já está cheia');S.inv.food--;S.food=Math.min(100,S.food+30);eatAnim('food');toast('Comeu (+30 fome)')}
 else{if(S.inv.water<1)return toast('Sem água');if(S.water>=100)return toast('Sede já está cheia');S.inv.water--;S.water=Math.min(100,S.water+35);eatAnim('water');toast('Bebeu (+35 sede)')}
}
bE.addEventListener('click',function(){useItem('food')});
bD.addEventListener('click',function(){useItem('water')});
W.addEventListener('keydown',function(e){if(e.code==='Digit1')useItem('food');if(e.code==='Digit2')useItem('water')});
var bL=document.getElementById('bL'),bF=document.getElementById('bF'),bW=document.getElementById('bW'),sc=document.getElementById('score');
function die(why){S.dead=true;document.getElementById('why').textContent=why;document.getElementById('over').style.display='flex'}
var last=performance.now();
function loop(now){
 requestAnimationFrame(loop);
 var dt=Math.min((now-last)/1000,.05);last=now;
 if(!S.dead){
  var ix=joy.x+((keys.KeyD||keys.ArrowRight)?1:0)-((keys.KeyA||keys.ArrowLeft)?1:0);
  var iz=joy.y+((keys.KeyW||keys.ArrowUp)?1:0)-((keys.KeyS||keys.ArrowDown)?1:0);
  var l=Math.hypot(ix,iz);if(l>1){ix/=l;iz/=l;l=1}
  var run=(keys.ShiftLeft||runBtn)&&l>0&&S.water>5;
  var sp=(run?9:5)*dt;
  var dx=(-Math.sin(yaw)*iz+Math.cos(yaw)*ix),dz=(-Math.cos(yaw)*iz-Math.sin(yaw)*ix);
  if(l>.05){S.x+=dx*sp;S.z+=dz*sp;pl.rotation.y=Math.atan2(dx,dz)}
  S.x=Math.max(-HALF+3,Math.min(HALF-3,S.x));S.z=Math.max(-HALF+3,Math.min(HALF-3,S.z));
  for(var i=0;i<blockers.length;i++){var b=blockers[i],ox=S.x-b.x,oz=S.z-b.z,d=Math.hypot(ox,oz);
   if(d<b.r+.4){var k=(b.r+.4)/(d||.01);S.x=b.x+ox*k;S.z=b.z+oz*k}}
  var m=run?2:(l>.05?1:.6);animPl(dt,now,l,run);
  S.food=Math.max(0,S.food-.3*m*dt);S.water=Math.max(0,S.water-.42*m*dt);
  if(S.food<=0||S.water<=0)S.life-=2.5*dt;else if(S.food>50&&S.water>50)S.life=Math.min(100,S.life+1*dt);
  for(var i=items.length-1;i>=0;i--){var it=items[i];
   it.rotation.y+=dt*2;it.position.y=it.userData.y0+Math.sin(now/400+i)*.12;
   if(Math.hypot(it.position.x-S.x,it.position.z-S.z)<1.3){
    if(it.userData.kind==='f'){S.inv.food++;toast('+1 lata')}else{S.inv.water++;toast('+1 água')}
    S.got++;scene.remove(it);items.splice(i,1);spawn(it.userData.kind);hint.style.opacity=0}}
  if(S.life<=0)die(S.food<=0&&S.water<=0?'Fome e sede levaram você.':(S.food<=0?'Você morreu de fome.':'Você morreu de sede.'));
 }
 pl.position.set(S.x,h(S.x,S.z)+P.bob,S.z);
 var cd=8,cx=S.x+Math.sin(yaw)*Math.cos(pitch)*cd,cz=S.z+Math.cos(yaw)*Math.cos(pitch)*cd;
 cam.position.set(cx,Math.max(h(S.x,S.z)+1.5+Math.sin(pitch)*cd,h(cx,cz)+1),cz);
 cam.lookAt(S.x,h(S.x,S.z)+1.5,S.z);
 bL.style.width=S.life+'%';bF.style.width=S.food+'%';bW.style.width=S.water+'%';sc.textContent='Achados: '+S.got;nF.textContent=S.inv.food;nW.textContent=S.inv.water;bE.disabled=S.inv.food<1;bD.disabled=S.inv.water<1;
 rd.render(scene,cam);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
