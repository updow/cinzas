name: Build Android (APK debug)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"
  ANDROID_HOME: /usr/lib/android-sdk
  ANDROID_SDK_ROOT: /usr/lib/android-sdk

jobs:
  android:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Preparar templates de exportação
        shell: bash
        run: |
          set -eux
          test -d /root/.local/share/godot/export_templates/4.3.stable
          mkdir -p "$HOME/.local/share/godot/export_templates"
          cp -a /root/.local/share/godot/export_templates/4.3.stable "$HOME/.local/share/godot/export_templates/"

      - name: Configurar Java e assinatura de depuração
        shell: bash
        run: |
          set -eux
          JAVAC_PATH="$(readlink -f "$(command -v javac)")"
          JAVA_HOME_PATH="$(dirname "$(dirname "$JAVAC_PATH")")"
          test -x "$JAVA_HOME_PATH/bin/java"
          echo "JAVA_HOME=$JAVA_HOME_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=/usr/lib/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/lib/android-sdk" >> "$GITHUB_ENV"

          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Importar e validar projeto
        shell: bash
        run: |
          set -eux
          godot --version
          godot --headless --path . --editor --quit

      - name: Exportar APK
        shell: bash
        run: |
          set -eux
          mkdir -p build/android
          godot --headless --path . --verbose --export-debug "Android" build/android/cinzas.apk
          test -s build/android/cinzas.apk

      - uses: actions/upload-artifact@v4
        with:
          name: cinzas-android-apk
          path: build/android/cinzas.apk
          if-no-files-found: error
