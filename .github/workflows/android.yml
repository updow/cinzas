name: Build Android (APK debug)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

jobs:
  android:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Preparar templates de exportação
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/4.3.stable
      - name: Importar projeto
        run: godot --headless --import || true
      - name: Exportar APK
        run: |
          mkdir -v -p build/android
          godot --headless --verbose --export-debug "Android" build/android/cinzas.apk
      - uses: actions/upload-artifact@v4
        with:
          name: cinzas-android-apk
          path: build/android
